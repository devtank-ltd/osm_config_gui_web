<body>

    <div class="console-grid-container">
        <button id="debug-start-btn" class="debug-start-btn">Start</button>
        <button id="debug-stop-btn" class="debug-stop-btn">Stop</button>
        <div id="console-terminal" class="console-terminal">
            <p id="console-terminal-para" class="console-terminal-para"></p>
        </div>

        <div id="console-cmd-field" class="console-cmd-field">
            <input id="console-cmd-input" placeholder="Send a command..."> </input>
            <button id="console-send-cmd-btn">Send</button>
        </div>
    </div>

    <div class="console-help"><button id="con-help">Help</button>
        <div id="help-container" class="help-container" style="display: none;">
        </div>
    </div>

</body>
